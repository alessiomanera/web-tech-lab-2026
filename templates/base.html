<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f0e8">
    <title>Museum AI Guide</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>
    <a href="#main-content" class="skip-to-content">Skip to main content</a>
    
    <header role="banner">
        <nav aria-label="Main Navigation">
            <a href="{{ url_for('main.home') }}" class="logo" aria-label="Museum AI Home">Museum AI</a>
            <ul class="nav-links">
                <li><a href="{{ url_for('main.home') }}">Home</a></li>
                <li><a href="{{ url_for('main.museums') }}">Museums</a></li>
                <li><a href="{{ url_for('main.guide') }}">AI Guide</a></li>
                {% if session.get('user_id') %}
                <li><a href="{{ url_for('auth.logout') }}">Logout</a></li>
                {% else %}
                <li><a href="{{ url_for('auth.login') }}">Login / Register</a></li>
                {% endif %}
                <li><button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode" style="background: none; border: var(--border-width) solid var(--border-color); border-radius: var(--border-radius); cursor: pointer; padding: 0.4rem 0.6rem; font-size: 1.2rem; transition: transform var(--transition-speed); display: inline-flex; align-items: center; justify-content: center;">🌓</button></li>
            </ul>
        </nav>
    </header>

    <main id="main-content" role="main">
        {% block content %}{% endblock %}
    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 Alessio Manera (905639) - Lab of Web Technologies</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
