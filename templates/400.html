{% extends 'base.html' %}

{% block title %}400 Bad Request | Italy Cultural Experiences{% endblock %}

{% block content %}
<div class="card error-page-card">
    <div class="mb-1">
        <span class="badge badge-yellow error-badge-lg">Error 400</span>
    </div>
    
    <h1 class="error-page-title">
        Bad Request
    </h1>
    
    <p class="error-page-desc">
        The server could not understand the request or the submission data was invalid.
    </p>

    <div class="card-actions justify-center gap-1">
        <a href="{{ url_for('main.home') }}" class="cta-button">
            &larr; Return to Home
        </a>
        <a href="{{ url_for('main.experiences') }}" class="cta-button cta-button-outline">
            Browse Experiences
        </a>
    </div>
</div>
{% endblock %}
